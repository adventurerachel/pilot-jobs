<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilot Jobs</title>
<meta name="theme-color" content="#2a86da">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilot Jobs">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e1e5ec;
  --primary:#1a56db; --primary-text:#fff;
  --tent:#c2610a; --tent-bg:#fff1e0;
  --conf:#188038; --conf-bg:#e4f4ea; --good-text:#fff;
  --danger:#c5221f; --warn:#b45309;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1319; --card:#171c25; --text:#e8ecf2; --muted:#9aa4b2; --line:#283040;
    --primary:#5b95ff; --primary-text:#0b1220;
    --tent:#f4a14d; --tent-bg:#2b2012;
    --conf:#5fd08a; --conf-bg:#122a1a; --good-text:#0b1d12;
    --danger:#ff7b75; --warn:#f4b24d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%}
/* Everything is sized in rem, so changing this one number scales the whole page.
   Phones are held close but have small CSS-pixel widths, so they get a larger base. */
@media (max-width:900px){html{font-size:106.25%}}
@media (max-width:600px){html{font-size:112.5%}}
@media (max-width:380px){.tab{font-size:.88rem;padding:9px 4px}}
body{margin:0;background:var(--bg);color:var(--text);
  font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:780px;margin:0 auto;padding:0 14px 90px}
h1{font-size:1.25rem;margin:0}
h2.sec{font-size:1rem;margin:22px 0 4px;display:flex;align-items:center;gap:8px}
h2.sec small{color:var(--muted);font-weight:500}
h3{font-size:1rem;margin:0 0 6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.tentative{background:var(--tent)} .dot.confirmed{background:var(--conf)}
.small{font-size:.9rem;color:var(--muted)}
.warn{color:var(--warn);font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.bar-actions{display:flex;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
  padding:10px 14px;font:inherit;font-weight:600;min-height:44px;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:transparent}
.btn.good{background:var(--conf);color:var(--good-text);border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%}
.icon{border:0;background:transparent;color:var(--muted);font-size:1.1rem;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.icon.sm{min-width:40px;min-height:40px;font-size:1rem}
body.busy .btn,body.busy .icon{pointer-events:none;opacity:.6}

.tabs{display:flex;gap:6px;margin:12px 0 0}
.tab{flex:1;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-weight:600;cursor:pointer;color:var(--muted)}
.tab.on{color:var(--text);border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}

.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer}
.card.tentative{border-left-color:var(--tent)} .card.confirmed{border-left-color:var(--conf)}
.card .t{font-weight:700;margin:0 0 2px;overflow-wrap:anywhere}
.card .meta{font-size:.95rem;color:var(--muted)}
.snippet{font-size:.95rem;color:var(--muted);margin-top:4px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.track{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.track i{display:block;height:100%;background:var(--conf);transition:width .25s}
.alert{background:var(--tent-bg);border:1px solid var(--danger);border-radius:12px;padding:10px 14px;margin:14px 0 4px}
.alert>b{color:var(--danger)}
.alert-row{padding:8px 0;border-top:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px;margin-top:6px;min-height:44px;justify-content:center}
.alert-row:first-of-type{border-top:0}
.alert-row small{font-size:.9rem}
.fprule{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:8px 0;background:var(--bg)}
.fpstat{font-size:.9rem;margin:6px 0 0;color:var(--muted)}
.fpstat.late,.alert-row small.late{color:var(--danger);font-weight:700}
.fpstat.soon,.alert-row small.soon{color:var(--danger);font-weight:600}
.fpstat.prompt{color:var(--warn);font-weight:600}
.fpstat.open{color:var(--conf)} .fpstat.ok{color:var(--conf);font-weight:600}
.confirmtick{display:flex;gap:12px;align-items:center;background:var(--conf-bg);border:1px solid var(--conf);border-radius:12px;padding:12px 14px;margin:8px 0 14px;cursor:pointer}
.confirmtick span{display:flex;flex-direction:column}
.confirmtick small{color:var(--muted);font-size:.88rem}
.connect{max-width:440px;margin:0 auto;padding-top:48px}
.connect h1{margin-bottom:8px}
.foot{text-align:center;margin:28px 0 0}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer;min-height:44px;padding:8px 14px}
[hidden]{display:none !important}
.item-sub{padding:0 14px 8px}
.item-sub select{font:inherit;padding:.3rem .4rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:inherit;margin-left:.3rem}
.modeicon{font-size:1.4rem;width:1.8rem;text-align:center}
.tabs.sub{margin:12px 0 0}
.tabs.sub .tab{padding:7px;font-size:.9rem}
.todo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:8px 0}
.todo.done{opacity:.5}
.todo.done b{text-decoration:line-through}
.todo-t{flex:1;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere}
.todo-t .sum{font-size:.9rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 10px}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.03em}
.badge.tentative{background:var(--tent-bg);color:var(--tent)}
.badge.confirmed,.badge.completed{background:var(--conf-bg);color:var(--conf)}
.badge.cancelled{background:var(--line);color:var(--muted)}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.detail{padding-top:14px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--text);min-height:44px}
textarea{resize:vertical}
input[type=checkbox]{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--conf);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.inline{display:flex;align-items:center;gap:10px;margin:8px 0;min-height:36px}
.chip{font-size:.88rem;font-weight:600;color:var(--muted)}
.chip.saved,.chip.confirmed{color:var(--conf)} .chip.error{color:var(--danger)} .chip.tentative{color:var(--tent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.actions .btn{flex:1;min-width:150px}

.next{background:var(--conf-bg);border:1px solid var(--conf);border-radius:12px;padding:12px 14px;margin:14px 0}
.next b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--conf)}
.sect{margin:22px 0}
.sect>h4.sub{margin:16px 0 4px;font-size:1rem;color:var(--muted)}
.sect>h3{display:flex;align-items:center;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.item.done{border-color:var(--conf)}
.item-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px}
.item-t{flex:1;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:4px 0;
  cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.item-t.static{cursor:default}
.item-t .sum{font-size:.9rem;color:var(--muted);font-weight:400;overflow-wrap:anywhere}
.item.done .item-t b{color:var(--muted);text-decoration:line-through}
.item-b{padding:4px 12px 12px;border-top:1px solid var(--line)}
.sect>.btn{margin-top:4px}
.addtask{display:flex;gap:8px;margin-top:6px}
.addtask input{flex:1}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);
  width:min(540px,calc(100vw - 24px));padding:16px 16px 14px;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-size:1.1rem;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;background:#1f2937;
  color:#fff;padding:11px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50;text-align:center}
#toast.on{opacity:1} #toast.err{background:#b42318}
</style>
</head>
<body>
<div id="app"></div>


<dialog id="confirmDlg">
  <form method="dialog">
    <h3 id="cfTitle"></h3>
    <p id="cfText"></p>
    <div class="row">
      <button class="btn ghost" value="cancel">Go back</button>
      <button class="btn primary" id="cfOk" value="ok"></button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
(function () {
'use strict';

// A link like  .../index.html?job=ABC123  (from a calendar event or email) opens that job once connected
const OPEN_JOB_ID = (new URLSearchParams(location.search).get('job') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 32);

// ---------- helpers ----------
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'i' + Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const THIS_YEAR = new Date().getFullYear();

// ---------- talking to the backend ----------
// This page is plain web hosting; it does not run inside Google. To read or change anything it sends a small
// JSON message to the Apps Script "web app" address and reads the JSON reply. Two things are remembered in this
// browser (localStorage): the web app address, and the passcode the server checks on every request.
const CFG_KEY = 'pilotjobs.config';
const URL_OK = /^https:\/\/script\.google\.com\/(?:a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/;
let memCfg = null;   // used if the browser won't let us use localStorage (some private windows)
function getCfg() {
  if (memCfg) return memCfg;
  try { const c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); return c && c.url ? c : null; } catch (e) { return null; }
}
function setCfg(c) { memCfg = c; try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) { /* kept in memory only */ } }
function clearCfg() { memCfg = null; try { localStorage.removeItem(CFG_KEY); } catch (e) { /* nothing to clear */ } }

const API_MSG = {
  auth: 'That passcode wasn’t accepted.',
  locked: 'Too many wrong attempts. Wait a few minutes, then try again.',
  not_configured: 'The server has no passcode yet. Add the API_PASSCODE script property (see the setup guide).',
  bad_request: 'The server didn’t understand that request. Is the page up to date?'
};

async function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (window.PILOT_MOCK) return window.PILOT_MOCK(fn, args);          // preview.html only: fake in-memory server
  const cfg = getCfg();
  if (!cfg || !cfg.key) { const e = new Error('Not connected.'); e.code = 'auth'; throw e; }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 45000);
  let data;
  try {
    // WHY text/plain: browsers send a "preflight" permission check before JSON requests to another site, and
    // Apps Script can't answer one. A text/plain POST counts as a "simple request", so no preflight happens.
    // The body is still JSON text, which the server parses itself.
    // WHY no cookies: a request to another site carries none of that site's cookies unless asked to. That's the
    // whole point. Google never sees which accounts are signed in on this device, so the multiple-accounts
    // problem can't happen. (The passcode in the body is what proves who is asking.)
    // WHY the passcode is in the body, not the address: addresses end up in logs and browser history.
    const res = await fetch(cfg.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args, key: cfg.key }), redirect: 'follow', signal: ctl.signal
    });
    data = await res.json();
  } catch (e) {
    const err = new Error(e && e.name === 'SyntaxError'
      ? 'The server’s reply wasn’t what I expected. Check the server address ends in /exec and that the deployment’s access is set to Anyone.'
      : 'Couldn’t reach the server. Check your connection and the server address.');
    err.code = 'network'; throw err;
  } finally { clearTimeout(timer); }
  if (!data || data.ok !== true) {
    const code = data && data.error;
    const err = new Error(API_MSG[code] || (data && data.message) || 'The server reported a problem.');
    err.code = code || 'server'; throw err;
  }
  return data.result;
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00Z');
  if (isNaN(d)) return s;
  const o = { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' };
  if (d.getUTCFullYear() !== THIS_YEAR) o.year = 'numeric';
  return d.toLocaleDateString('en-GB', o);
}
function fmtDT(s) { if (!s) return ''; const p = s.split('T'); return fmtDate(p[0]) + ' ' + (p[1] || ''); }
function dateRange(j) {
  if (!j.startDate) return '';
  let s = fmtDate(j.startDate) + (j.startTime ? ' ' + j.startTime : '');
  if (j.endDate && j.endDate !== j.startDate) s += ' \u2192 ' + fmtDate(j.endDate) + (j.endTime ? ' ' + j.endTime : '');
  else if (j.endTime) s += ' \u2013 ' + j.endTime;
  return s;
}
function nightsBetween(a, b) {
  if (!a || !b) return 0;
  const n = Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
  return n > 0 ? n : 0;
}
// ---- deadline windows for flight plans and GARs (all times UTC) ----
const DNAME = { fp: 'Flight plan', gar: 'GAR' };
function legDep(l) {
  if (!l.date || !l.time) return null;
  const p = l.date.split('-').map(Number), q = l.time.split(':').map(Number);
  const dep = Date.UTC(p[0], p[1] - 1, p[2], q[0], q[1]);
  return isNaN(dep) ? null : dep;
}
function parisWeekend(ms) {
  const d = new Date(ms).toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'Europe/Paris' });
  return d === 'Sat' || d === 'Sun';
}
// ICAO airport codes start with a region prefix: EG = United Kingdom, LF = France. Anything else that looks like an ICAO code is "anywhere else".
function icaoCountry(code) {
  const c = String(code || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(c)) return '';
  return c.startsWith('EG') ? 'UK' : c.startsWith('LF') ? 'FR' : 'OTHER';
}
const joinRoute = l => l.from && l.to ? l.from + ' \u2192 ' + l.to : (l.from || l.to || '');
// Older legs stored one "route" string: split "EGKB > LFMN" into the two fields when the page loads them.
function splitLeg(l) {
  if (!l.from && !l.to && l.route) {
    const m = /^\s*([A-Za-z]{4})\s*(?:>|\u2192|-|to)\s*([A-Za-z]{4})\s*$/i.exec(l.route);
    if (m) { l.from = m[1].toUpperCase(); l.to = m[2].toUpperCase(); }
  }
  l.from = l.from || ''; l.to = l.to || ''; l.destManual = !!l.destManual;
  if (l.to && !l.destManual && icaoCountry(l.to)) l.dest = icaoCountry(l.to);
  return l;
}
// GAR rule from the destination country (set by the pilot's rules). null until a destination is chosen.
function garRule(l) {
  if (l.dest === 'UK') return { earliest: 48, latest: 0, note: 'UK arrival: GAR no earlier than 48 h before flight time.' };
  if (l.dest === 'OTHER') return { earliest: '', latest: 0, note: 'No GAR rule for this destination.' };
  if (l.dest === 'FR') {
    if (!l.date) return { earliest: '', latest: 0, note: 'France: the rule depends on the weekday – add the departure date.' };
    const dep = legDep({ date: l.date, time: l.time || '12:00' });
    return parisWeekend(dep)
      ? { earliest: '', latest: 48, note: 'France, weekend: GAR at least 48 h before flight time.' }
      : { earliest: 24, latest: 0, note: 'France, weekday: GAR within 24 h of flight time (not earlier).' };
  }
  return null;
}
function legRule(l, kind) { return kind === 'gar' ? garRule(l) : { earliest: l.fpEarliest, latest: l.fpLatest }; }
function legWindow(l, kind) {
  const rule = legRule(l, kind), dep = legDep(l);
  if (!rule || dep == null) return null;
  const early = (rule.earliest === '' || rule.earliest == null) ? null : Number(rule.earliest);
  const late = (rule.latest === '' || rule.latest == null) ? 0 : Number(rule.latest);
  return { dep: dep, opens: early == null ? null : dep - early * 36e5, due: dep - late * 36e5 };
}
function fmtUTC(ms) {
  return new Date(ms).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'UTC' }) + ' UTC';
}
function human(ms) {
  const a = Math.abs(ms), h = Math.floor(a / 36e5);
  return h >= 48 ? Math.floor(h / 24) + ' days' : h >= 1 ? h + ' h' : Math.max(1, Math.round(a / 6e4)) + ' min';
}
// kind: 'fp' | 'gar'.  level: ok | info | prompt | wait | open | soon | late | past
function legStatus(l, kind) {
  const gar = kind === 'gar';
  if (gar ? l.gar : l.plan) return { level: 'ok', text: gar ? 'GAR submitted ✓' : 'Flight plan filed ✓' };
  const verb = gar ? 'submit' : 'file';
  let prompt = '';
  if (gar) {
    if (!garRule(l)) return { level: 'prompt', text: 'Choose the destination country above to apply the GAR rule.' };
  } else {
    const hasRule = (l.fpEarliest !== '' && l.fpEarliest != null) || (l.fpLatest !== '' && l.fpLatest != null);
    if (!hasRule && l.fpNoRule !== true) prompt = 'Check the filing rule for this jurisdiction and enter it above (or tick “No specific rule”). ';
  }
  const w = legWindow(l, kind);
  if (!w) return { level: 'info', text: 'Add the departure date and time (UTC) to work out the deadline.' };
  const now = Date.now();
  if (now > w.dep) return { level: 'past', text: 'Departure time has passed. Tick the box if it was done.' };
  if (now > w.due) return { level: 'late', text: prompt + 'Deadline passed ' + human(now - w.due) + ' ago (' + fmtUTC(w.due) + ').' };
  if (w.opens != null && now < w.opens)
    return { level: 'wait', text: prompt + 'Too early to ' + verb + ' – window opens in ' + human(w.opens - now) + ' (' + fmtUTC(w.opens) + '). Deadline ' + fmtUTC(w.due) + '.' };
  const left = w.due - now;
  if (left <= 864e5) return { level: 'soon', text: prompt + (gar ? 'Submit' : 'File') + ' now – deadline in ' + human(left) + ' (' + fmtUTC(w.due) + ').' };
  return { level: prompt ? 'prompt' : 'open', text: prompt + 'Window open – deadline in ' + human(left) + ' (' + fmtUTC(w.due) + ').' };
}
const fpStatus = l => legStatus(l, 'fp');
function deadlineAlerts() {
  const out = [];
  S.active.filter(j => j.status === 'confirmed').forEach(j => (j.legs || []).forEach(l => ['gar', 'fp'].forEach(kind => {
    const st = legStatus(l, kind);
    if (st.level === 'late' || st.level === 'soon') out.push({ job: j, leg: l, kind: kind, s: st, due: legWindow(l, kind).due });
  })));
  return out.sort((a, b) => a.due - b.due);
}
function alertBanner() {
  const a = deadlineAlerts();
  if (!a.length) return '';
  return '<div class="alert"><b>⚠ Deadlines need attention</b>' + a.map(x =>
    '<div class="alert-row" data-act="open" data-id="' + x.job.id + '"><span>' + esc(DNAME[x.kind] + ' · ' + (x.leg.route || 'Leg') + ' · ' + jobTitle(x.job)) +
    '</span><small class="' + x.s.level + '">' + esc(x.s.text) + '</small></div>').join('') + '</div>';
}

const jobTitle = j => j.title || (j.notes || '').split('\n')[0].slice(0, 50) || j.location || 'Untitled job';
const sortKey = j => (j.startDate || '0000-00-00') + (j.startTime || '');
const cmp = (a, b) => sortKey(a) < sortKey(b) ? -1 : sortKey(a) > sortKey(b) ? 1 : 0;

// ---------- state ----------
const S = { active: [], archive: [], appUrl: '', calendarName: 'Pilot Jobs', reminders: [1440, 240, 120],
            colours: { tentative: 'orange', confirmed: 'green' },
            tab: 'active', todoSort: 'date', openId: null, draft: null, needConnect: false, connectError: '', cxUrl: null, loaded: false, error: '', opened: false, imp: null };
const UI = { open: new Set() };
const saving = {};

const findJob = id => id === 'draft' ? S.draft : (S.active.find(j => j.id === id) || S.archive.find(j => j.id === id));

// ---------- checklist model ----------
const legName = l => l.route ? ' (' + l.route + ')' : '';
// How the pilot gets to / from the job. "car" = driving himself: nothing to book, no calendar event.
const MODES = [['flight', 'Flight'], ['train', 'Train'], ['car', 'Driving'], ['other', 'Other (bus, ferry\u2026)']];
const travelMode = f => f.mode || (f.commercial === false ? 'other' : 'flight');
const fixTravel = f => { f.mode = travelMode(f); f.commercial = f.mode === 'flight'; return f; };
const CATS = [['gar', 'Submit GARs'], ['plan', 'File flight plans'], ['handling', 'Handling, fuel & permits'], ['wx', 'Weather & NOTAM briefings'],
  ['out', 'Book outbound travel'], ['ret', 'Book return travel'], ['checkin', 'Check in for flights'],
  ['stay', 'Book accommodation'], ['after', 'Post-flight tasks']];
function allChecks(j) {
  const out = [];
  j.flights.forEach(fixTravel);
  const start = j.startDate || '', end = j.endDate || j.startDate || '';
  const day = s => (s || '').slice(0, 10);
  j.legs.forEach(l => {
    const d = l.date || start;
    const gw = legWindow(l, 'gar');
    out.push({ cat: 'gar', label: 'Submit GAR' + legName(l), detail: l.route, done: l.gar, list: 'legs', id: l.id, field: 'gar',
      date: gw ? new Date(gw.due).toISOString().slice(0, 10) : d, leg: l });
    const w = legWindow(l, 'fp');
    out.push({ cat: 'plan', label: 'File flight plan' + legName(l), detail: l.route, done: l.plan, list: 'legs', id: l.id, field: 'plan',
      date: w ? new Date(w.due).toISOString().slice(0, 10) : d, leg: l });
    out.push({ cat: 'handling', label: 'Arrange handling, fuel & permits' + legName(l), detail: l.route, done: l.handling, list: 'legs', id: l.id, field: 'handling', date: d });
    out.push({ cat: 'wx', label: 'Weather & NOTAM briefing' + legName(l), detail: l.route, done: l.wx, list: 'legs', id: l.id, field: 'wx', date: d });
  });
  const noun = f => ({ flight: 'flight', train: 'train' }[f.mode] || 'travel');
  j.flights.filter(f => f.dir === 'out' && f.mode !== 'car').forEach(f =>
    out.push({ cat: 'out', label: 'Book outbound ' + noun(f) + (f.route ? ' (' + f.route + ')' : ''), detail: f.route, done: f.booked,
      list: 'flights', id: f.id, field: 'booked', date: day(f.depart) || start }));
  j.flights.filter(f => f.dir === 'return' && f.mode !== 'car').forEach(f =>
    out.push({ cat: 'ret', label: 'Book return ' + noun(f) + (f.route ? ' (' + f.route + ')' : ''), detail: f.route, done: f.booked,
      list: 'flights', id: f.id, field: 'booked', date: day(f.depart) || end }));
  ['out', 'return'].forEach(dir => j.flights.filter(f => f.dir === dir && f.commercial).forEach(f =>
    out.push({ cat: 'checkin', label: 'Check in for ' + (dir === 'out' ? 'outbound' : 'return') + ' flight' + (f.route ? ' (' + f.route + ')' : ''),
      detail: f.route, done: f.checkedIn, list: 'flights', id: f.id, field: 'checkedIn', date: day(f.depart) || (dir === 'out' ? start : end), when: f.depart })));
  j.stays.forEach(s =>
    out.push({ cat: 'stay', label: 'Book accommodation' + (s.location ? ' \u2013 ' + s.location : ''), detail: s.location, done: s.booked,
      list: 'stays', id: s.id, field: 'booked', date: s.checkIn || start }));
  j.tasks.forEach(t => out.push({ cat: 'after', label: t.label, detail: t.label, done: t.done, list: 'tasks', id: t.id, field: 'done', date: end }));
  return out;
}
function todoItems() {
  const out = [];
  S.active.filter(j => j.status === 'confirmed').forEach(j =>
    allChecks(j).forEach(c => { if (!c.done) out.push(Object.assign({ job: j }, c)); }));
  const key = t => (t.date || '9999-99-99');
  const order = t => CATS.findIndex(c => c[0] === t.cat);
  return out.sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : order(a) - order(b));
}
function todoRow(t, byTask) {
  const main = byTask ? (t.detail || 'Details to be added') : t.label;
  let sub = esc(jobTitle(t.job)) + (byTask && t.date ? ' \u00b7 ' + fmtDate(t.date) : '');
  if (t.cat === 'checkin') sub += '<br><span class="fpstat">' + (t.when ? 'Departs ' + esc(fmtDT(t.when)) : 'Add the departure time to get reminders') + '</span>';
  if ((t.cat === 'plan' || t.cat === 'gar') && t.leg) { const s = legStatus(t.leg, t.cat === 'gar' ? 'gar' : 'fp'); sub += '<br><span class="fpstat ' + s.level + '">' + esc(s.text) + '</span>'; }

function todoHTML() {
  const items = todoItems();

    '<div class="tab ' + (S.todoSort === 'task' ? 'on' : '') + '" data-act="sort" data-sort="task">By task</div></div>';
  if (!items.length) return seg + '<div class="empty">Nothing outstanding \u2713<br><span class="small">Confirmed jobs\u2019 open checklist items appear here.</span></div>';
  let body = seg;
  if (S.todoSort === 'task') {
    CATS.forEach(c => {
      const g = items.filter(t => t.cat === c[0]);
      if (g.length) body += '<h2 class="sec">' + c[1] + ' <small>' + g.length + '</small></h2>' + g.map(t => todoRow(t, true)).join('');
    });
  } else {
    let last = null;
    items.forEach(t => {
      if (t.date !== last) { last = t.date; body += '<h2 class="sec">' + (t.date ? fmtDate(t.date) : 'No date yet') + '</h2>'; }

}
function progress(j) {
  const c = allChecks(j);
  const done = c.filter(x => x.done).length;
  const next = c.find(x => !x.done);
  return { done, total: c.length, next: next ? next.label : '', pct: c.length ? Math.round(100 * done / c.length) : 0 };
}
function isDone(list, it) {
  if (list === 'flights' && travelMode(it) === 'car') return true;          // driving yourself: nothing to do
  if (list === 'legs') return it.gar && it.plan && it.handling && it.wx;
  return !!(it.booked || it.done);
}
function minutesText() {

}
function flightHint(f) {

  if (f.checkedIn) return 'Checked in \u2013 check-in reminders are switched off.';

                  : 'Add a departure time to get check-in reminders ' + minutesText() + ' before.';
}
function itemSummary(list, it) {
  if (list === 'flights') {
    const base = [it.flightNo, it.route, it.depart ? fmtDT(it.depart) : ''].filter(Boolean).join(' \u00B7 ') || 'Tap to add details';
    return base + ' \u00B7 ' + (it.booked ? 'Booked \u2713' : 'To book') +
      (travelMode(it) === 'car' ? ' \u00B7 Driving' : '') + (it.commercial && it.booked ? ' \u00B7 ' + (it.checkedIn ? 'Checked in \u2713' : 'Not checked in') : '');
  }
  if (list === 'stays') {

    return [it.location || 'Location TBC', dates, n ? n + (n === 1 ? ' night' : ' nights') : ''].filter(Boolean).join(' \u00B7 ') +

  if (list === 'legs') {

    const hot = kind => { const lv = legStatus(it, kind).level; return lv === 'late' || lv === 'soon'; };
    return [it.route || 'Route TBC', it.date ? fmtDate(it.date) + (it.time ? ' ' + it.time + 'Z' : '') : '', k + '/4 done',
      hot('gar') ? '\u26A0 GAR due' : '', hot('fp') ? '\u26A0 flight plan due' : ''].filter(Boolean).join(' \u00B7 ');
  }

}
function calState(j) {

// ---------- saving ----------
function scheduleSave(id, delay) {
  if (id === 'draft') return;            // a new job isn't saved until the person taps Save
  const s = saving[id] || (saving[id] = { timer: null, inflight: false, dirty: false });
  clearTimeout(s.timer);
  setChip('pending');
  s.timer = setTimeout(() => { s.timer = null; doSave(id); }, delay);
}
async function doSave(id) {
  const s = saving[id];
  if (s.inflight) { s.dirty = true; return; }
  const j = findJob(id);
  if (!j || isArchived(j)) return;
  s.inflight = true; s.dirty = false;
  setChip('saving');
  try {
    const res = await api('saveJob', j);
    mergeServer(j, res);
    if (!s.dirty) setChip('saved');
  } catch (e) {
    setChip('error'); toast(e.message, 'err');
  } finally {
    s.inflight = false;
    if (s.dirty && !s.timer) doSave(id);
  }
}
async function flush(id) {
  const s = saving[id];
  if (!s) return;
  if (s.timer) { clearTimeout(s.timer); s.timer = null; await doSave(id); }

}
function mergeServer(j, res) {
  j.eventId = res.eventId; j.calSig = res.calSig; j.updated = res.updated; j.syncError = res.syncError || '';
  j.flights.forEach(f => {
    const r = (res.flights || []).find(x => x.id === f.id);
    if (r) { f.eventId = r.eventId; f.sig = r.sig; }

}

// update labels/progress without re-rendering (keeps keyboard focus while typing)
function refreshDerived(j) {
  const p = progress(j);
  const bar = $('#progress i'); if (bar) bar.style.width = p.pct + '%';
  const pt = $('#progText'); if (pt) pt.textContent = p.done + ' of ' + p.total + ' done';
  const nx = $('#nextUp'); if (nx) nx.textContent = p.next || 'All done \u2713';
  document.querySelectorAll('[data-list][data-id]').forEach(el => {
    const list = el.dataset.list;
    const it = (j[list] || []).find(x => x.id === el.dataset.id);
    if (!it) return;
    const s = el.querySelector('[data-sum]'); if (s) s.textContent = itemSummary(list, it);
    el.classList.toggle('done', !!isDone(list, it));
    const h = el.querySelector('[data-hint]'); if (h) h.textContent = flightHint(it);
    const ck = el.querySelector('[data-checkin]'); if (ck) ck.hidden = !it.commercial;
    const fp = el.querySelector('[data-fp]'); if (fp) { const s = fpStatus(it); fp.className = 'fpstat ' + s.level; fp.textContent = s.text; }
    const ga = el.querySelector('[data-gar]'); if (ga) { const s = legStatus(it, 'gar'); ga.className = 'fpstat ' + s.level; ga.textContent = s.text; }
    const gn = el.querySelector('[data-garnote]'); if (gn) { const r = garRule(it); gn.textContent = r ? r.note : ''; }
  });
  const cs = $('#calstate'); if (cs) cs.innerHTML = calState(j);
}

// ---------- events ----------
function onField(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.f || !S.openId) return;
  const j = findJob(S.openId);
  if (!j || isArchived(j)) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  const itemEl = el.closest('[data-list]');
  if (itemEl) {
    const it = j[itemEl.dataset.list].find(x => x.id === itemEl.dataset.id);
    if (!it) return;
    it[el.dataset.f] = val;
    if (itemEl.dataset.list === 'flights' && el.dataset.f === 'mode') { it.commercial = val === 'flight'; refreshDerived(j); scheduleSave(j.id, 250); render(); return; }
    if (itemEl.dataset.list === 'legs') {
      const f = el.dataset.f;
      if (f === 'from' || f === 'to') {
        const up = String(val).toUpperCase().replace(/[^A-Z]/g, ''); if (up !== val) el.value = up;
        it[f] = up; it.route = joinRoute(it);
        if (f === 'to' && icaoCountry(up)) {            // a new destination: infer the country again
          it.dest = icaoCountry(up); it.destManual = false;
          const sel = itemEl.querySelector('[data-f=dest]'); if (sel) sel.value = it.dest;
        }
      } else if (f === 'dest') it.destManual = true;
      const dn = itemEl.querySelector('[data-destnote]'); if (dn) dn.textContent = destNote(it);
    }
  } else {
    j[el.dataset.f] = val;
  }
  refreshDerived(j);
  const quick = el.type === 'checkbox' || el.tagName === 'SELECT' || /date|time/.test(el.type);
  scheduleSave(j.id, quick ? 250 : 700);
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

// ticking an item straight from the To do tab
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.todo) return;
  const p = el.dataset.todo.split('|');
  const j = S.active.find(x => x.id === p[0]);
  const it = j && j[p[1]].find(x => x.id === p[2]);
  if (!it) return;
  it[p[3]] = el.checked;
  const row = el.closest('.todo'); if (row) row.classList.toggle('done', el.checked);
  scheduleSave(j.id, 250);
  setTimeout(() => { if (!S.openId && S.tab === 'todo') render(); }, 700);   // let the tick show, then drop the row
});

function addItem(list, item) {
  const j = findJob(S.openId);
  j[list].push(item);
  if (list !== 'tasks' && list !== 'legs') UI.open.add(item.id);
  scheduleSave(j.id, 100);
  render();
}
const newFlight = dir => ({ id: uid(), dir, route: '', flightNo: '', depart: '', arrive: '', ref: '', booked: false, checkedIn: false, mode: 'flight', commercial: true, eventId: '', sig: '' });

function moveToArchive(j) {
  S.active = S.active.filter(x => x.id !== j.id);
  S.archive = S.archive.filter(x => x.id !== j.id);
  S.archive.push(j);
}
function replaceActive(job) {
  S.archive = S.archive.filter(x => x.id !== job.id);
  const i = S.active.findIndex(x => x.id === job.id);
  if (i >= 0) S.active[i] = job; else S.active.push(job);
}

const actions = {
  'new'() { S.draft = newDraft(); S.openId = 'draft'; window.scrollTo(0, 0); render(); },
  'save-new'() { saveDraft(); },
  'import-open'() { S.imp = null; S.openId = 'import'; window.scrollTo(0, 0); render(); },
  'import-close'() { S.imp = null; S.openId = null; render(); },
  'import-pick'() { $('#impFile').click(); },
  'import-go'() { importGo(); },
  refresh() { load(); },
  async connect() {
    const url = ($('#cxUrl').value || '').trim(), key = $('#cxKey').value;
    S.cxUrl = url;
    if (!URL_OK.test(url)) { S.connectError = 'That doesn’t look like a Pilot Jobs server address. It should start with https://script.google.com/ and end in /exec.'; return render(); }
    if (!key) { S.connectError = 'Enter the passcode.'; return render(); }
    setCfg({ url: url, key: key });
    S.connectError = '';
    await busy(() => load(true));
  },
  async disconnect() {
    if (!await askConfirm('Disconnect this device?', 'You’ll need the server address and passcode to connect again. Your jobs stay safe in Google.', 'Disconnect', true)) return;
    clearCfg(); S.loaded = false; S.needConnect = true; S.connectError = ''; S.cxUrl = '';
    S.active = []; S.archive = []; S.openId = null; S.draft = null; render();
  },
  tab(t) { S.tab = t.dataset.tab; render(); },
  sort(t) { S.todoSort = t.dataset.sort; render(); },
  open(t) { S.openId = t.dataset.id; window.scrollTo(0, 0); render(); },
  async back() {
    if (S.openId === 'draft') {
      if (S.draft && draftDirty(S.draft) && !await askConfirm('Discard this new job?', 'Nothing has been saved yet.', 'Discard', true)) return;
      S.draft = null; S.openId = null; render(); return;
    }
    if (S.openId) await flush(S.openId); S.openId = null; chip = ''; render();
  },
  toggle(t) { UI.open.has(t.dataset.id) ? UI.open.delete(t.dataset.id) : UI.open.add(t.dataset.id); render(); },
  del(t) {

  },
  'add-out'() { addItem('flights', newFlight('out')); },
  'add-ret'() { addItem('flights', newFlight('return')); },
  'add-stay'() {
    const j = findJob(S.openId);
    const last = j.stays[j.stays.length - 1];
    addItem('stays', { id: uid(), location: '', checkIn: last ? last.checkOut : j.startDate, checkOut: '', ref: '', booked: false });
  },
  'add-leg'() { addItem('legs', newLeg('')); },
  'add-task'() {
    const inp = $('#newTask'); const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    addItem('tasks', { id: uid(), label: v, done: false });
  },
  async confirm() {
    const j = findJob(S.openId);
    if (!await askConfirm('Confirm this job?', 'It will turn ' + S.colours.confirmed + ' on the calendar and the booking checklist will appear.', 'Confirm job', false)) return;
    await busy(async () => {

        const job = await api('setStatus', j.id, 'confirm');
        replaceActive(job); render(); window.scrollTo(0, 0);

      } catch (e) { toast(e.message, 'err'); }
    });
  },
  async cancel() {
    const j = findJob(S.openId);
    if (!await askConfirm('Cancel this job?', 'It will be removed from the calendar (including any flight reminders) and kept in the Archive.', 'Cancel job', true)) return;
    await busy(async () => {
      try {
        await flush(j.id);
        const job = await api('setStatus', j.id, 'cancel');
        moveToArchive(job); S.openId = null; render();
        toast('Cancelled \u2013 removed from the calendar and archived');
      } catch (e) { toast(e.message, 'err'); }
    });
  },
  async complete() {
    const j = findJob(S.openId);
    const p = progress(j);
    if (!await askConfirm('Mark job complete?', p.done < p.total ? (p.total - p.done) + ' checklist item(s) are still open. It will move to the Archive; calendar entries stay.' : 'It will move to the Archive; calendar entries stay.', 'Mark complete', false)) return;
    await busy(async () => {
      try {
        await flush(j.id);
        const job = await api('setStatus', j.id, 'complete');
        moveToArchive(job); S.openId = null; render();
        toast('Job completed and archived');
      } catch (e) { toast(e.message, 'err'); }
    });
  },
  async restore() {
    const j = findJob(S.openId);
    await busy(async () => {
      try {
        const job = await api('setStatus', j.id, 'restore');
        replaceActive(job); S.tab = 'active'; render();
        toast(job.syncError || 'Job restored', job.syncError ? 'err' : '');
      } catch (e) { toast(e.message, 'err'); }

};

async function saveDraft() {
  const j = S.draft;
  if (!j) return;
  const err = $('#newErr');
  if (!j.notes.trim() && !j.title.trim() && !j.location.trim()) { err.textContent = 'Add a few notes, a title or a route first.'; return; }
  const conf = j.status === 'confirmed';
  const data = { status: j.status };
  ['title', 'notes', 'location', 'startDate', 'startTime', 'endDate', 'endTime'].forEach(k => { data[k] = String(j[k] || '').trim(); });
  if (conf) ['flights', 'stays', 'legs', 'tasks'].forEach(k => { data[k] = j[k]; });
  await busy(async () => {
    try {
      const job = await api('createJob', data);
      S.active.push(job); S.draft = null; S.openId = null; S.tab = 'active'; render();
      toast(job.syncError || (job.eventId
        ? 'Saved as ' + job.status + ' and added to your calendar (' + (S.colours[job.status] || '') + ')'
        : 'Saved as ' + job.status + ' – add a start date to put it on the calendar'), job.syncError ? 'err' : '');
    } catch (e) { err.textContent = e.message; toast(e.message, 'err'); }
  });
}

document.addEventListener('change', e => {

// ---------- import jobs from a spreadsheet (.xlsx / .csv, made from the template) ----------
// The file is read in this browser (SheetJS, loaded from cdnjs only when needed); nothing is sent anywhere
// except the finished jobs, which go to your own Apps Script exactly like jobs typed in by hand.
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const IMPORT_MAX_JOBS = 25;
const HEAD_KEYS = { job: ['job', 'jobtitle', 'title', 'trip'], status: ['status'], date: ['date', 'departuredate'],
  time: ['time', 'timeutc', 'departuretime', 'departuretimeutc'], from: ['from', 'fromicao', 'origin'], to: ['to', 'toicao', 'destination'], notes: ['notes', 'note'] };
const isoDate = (y, m, d) => {
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d
    ? y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') : null;
};
// A date cell is either an Excel serial number or text (2026-11-10 or UK style 10/11/2026). Returns '' for blank, null for unreadable.
function cellDate(v) {
  if (v === '' || v == null) return '';
  if (v instanceof Date) return isNaN(v) ? null : isoDate(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5); return v >= 1 ? isoDate(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()) : null; }
  const s = String(v).trim(); let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return isoDate(+m[1], +m[2], +m[3]);
  if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/.exec(s))) return isoDate(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return null;
}
// A time cell is an Excel time (a fraction of a day) or text (09:00, 0900, 9.30, 09:00Z). Returns '' for blank, null for unreadable.
function cellTime(v) {
  if (v === '' || v == null) return '';
  const hm = (h, m) => h < 24 && m < 60 ? String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') : null;
  if (typeof v === 'number') { const mins = Math.round((v - Math.floor(v)) * 1440) % 1440; return hm(Math.floor(mins / 60), mins % 60); }
  const m = /^(\d{1,2})\s*[:.h]?\s*(\d{2})(?::\d{2})?\s*z?$/i.exec(String(v).trim());
  return m ? hm(+m[1], +m[2]) : null;
}
const normHead = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
// rows = what SheetJS gives for a sheet: one object per row, keyed by the header text.
function parseImport(rows) {
  const issues = [], groups = [], byKey = {};
  const colOf = {};
  if (rows.length) Object.keys(rows[0]).forEach(h => { const n = normHead(h); Object.keys(HEAD_KEYS).forEach(k => { if (!colOf[k] && HEAD_KEYS[k].includes(n)) colOf[k] = h; }); });
  if (!colOf.from || !colOf.to) return { groups: [], issues: ['I couldn’t find the “From” and “To” columns. Please use the template (the first row must be its headings).'], read: 0 };
  const get = (r, k) => colOf[k] ? r[colOf[k]] : '';
  let last = '', read = 0;
  rows.forEach((r, i) => {
    const n = i + 2;                                                      // spreadsheet row number (row 1 is the headings)
    if (Object.keys(colOf).every(k => String(get(r, k)).trim() === '')) return;
    read++;
    const from = String(get(r, 'from')).trim().toUpperCase(), to = String(get(r, 'to')).trim().toUpperCase();
    const date = cellDate(get(r, 'date')), time = cellTime(get(r, 'time'));
    const bad = [];
    if (!/^[A-Z]{4}$/.test(from)) bad.push('From must be a 4-letter ICAO code');
    if (!/^[A-Z]{4}$/.test(to)) bad.push('To must be a 4-letter ICAO code');
    if (date === null) bad.push('the date isn’t readable');
    if (time === null) bad.push('the time isn’t readable');
    if (bad.length) { issues.push('Row ' + n + ' skipped: ' + bad.join(', ') + '.'); return; }
    let title = String(get(r, 'job')).trim() || last; last = title;
    if (!title) title = 'Imported job';
    const key = title.toLowerCase();
    let g = byKey[key];
    if (!g) { g = byKey[key] = { title: title, status: '', notes: '', legs: [] }; groups.push(g); }
    const st = String(get(r, 'status')).trim().toLowerCase();
    if (st && !g.status) {
      if (/^(c|conf)/.test(st)) g.status = 'confirmed'; else if (/^(t|tent)/.test(st)) g.status = 'tentative';
      else issues.push('Row ' + n + ': status “' + get(r, 'status') + '” isn’t Confirmed or Tentative – treated as Confirmed.');
    }
    const note = String(get(r, 'notes')).trim(); if (note && !g.notes.includes(note)) g.notes += (g.notes ? '\n' : '') + note;
    if (date === '') issues.push('Row ' + n + ': no date, so deadlines can’t be worked out for this leg.');
    g.legs.push({ from: from, to: to, date: date, time: time });
  });
  groups.forEach(g => {
    g.status = g.status || 'confirmed';
    const ds = g.legs.map(l => l.date).filter(Boolean).sort();
    g.start = ds[0] || ''; g.end = ds[ds.length - 1] || ''; g.pick = true;
    g.dup = S.active.some(j => (j.title || '').toLowerCase() === g.title.toLowerCase() && (j.startDate || '') === g.start);
    if (g.dup) g.pick = false;
  });
  return { groups: groups, issues: issues, read: read };
}
// What createJob() receives: confirmed jobs get a full starting checklist with the legs filled in; tentative jobs keep the legs in their notes.
function importPayload(g) {
  const data = { title: g.title, status: g.status, notes: g.notes, location: '', startDate: g.start, endDate: g.end || g.start, startTime: '', endTime: '' };
  if (g.status === 'confirmed') {
    data.flights = [newFlight('out'), newFlight('return')];
    data.stays = [{ id: uid(), location: '', checkIn: g.start, checkOut: g.end || g.start, ref: '', booked: false }];
    data.legs = g.legs.map(l => Object.assign(newLeg(l.date), { from: l.from, to: l.to, route: l.from + ' > ' + l.to, time: l.time, dest: icaoCountry(l.to) || 'UK' }));
    data.tasks = [{ id: uid(), label: 'Send invoice', done: false }, { id: uid(), label: 'Log expenses and receipts', done: false }];
  } else {
    data.notes = [g.notes].concat(g.legs.map(l => l.from + ' > ' + l.to + (l.date ? ' ' + l.date : '') + (l.time ? ' ' + l.time + 'Z' : ''))).filter(Boolean).join('\n');
  }
  return data;
}
function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = XLSX_URL;
    s.onload = ok; s.onerror = () => fail(new Error('Couldn’t load the spreadsheet reader – check your connection and try again.'));
    document.head.appendChild(s);
  });
}
async function importFile(file) {
  S.imp = { name: file.name, groups: [], issues: [], read: 0, error: '', ready: false };
  render();
  try {
    await loadXlsxLib();
    const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const name = wb.SheetNames.find(n => /^legs$/i.test(n)) || wb.SheetNames[0];
    const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '', raw: true });
    Object.assign(S.imp, parseImport(rows), { ready: true });
  } catch (e) { S.imp.error = e.message || String(e); }
  render();
}
function renderImport(app) {
  const imp = S.imp;
  const head = '<header class="bar"><button class="btn ghost" data-act="import-close">← Jobs</button><b>Import jobs</b></header>';
  let body = '<section class="sect"><p>Fill in the template, then choose the file here. Each different <b>Job title</b> becomes one job; each row is one flight leg.</p>' +
    '<p><a class="btn" href="pilot-jobs-import-template.xlsx" download>Download the template</a></p>' +
    '<p class="small">Using Google Sheets? Copy the template into Sheets, fill it in, then <b>File → Download → Microsoft Excel (.xlsx)</b> (on the phone app: Share &amp; export → Save as Excel). A .csv file works too.</p>' +
    '<input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden>' +
    '<button class="btn primary" data-act="import-pick">' + (imp ? 'Choose a different file' : 'Choose spreadsheet') + '</button></section>';
  if (imp) {
    if (imp.error) body += '<p class="fpstat late">' + esc(imp.error) + '</p>';
    if (!imp.ready && !imp.error) body += '<p class="small">Reading ' + esc(imp.name) + '…</p>';
    if (imp.ready) {
      body += '<h2 class="sec">' + esc(imp.name) + ' <small>' + imp.groups.length + ' job' + (imp.groups.length === 1 ? '' : 's') + ', ' + imp.read + ' row' + (imp.read === 1 ? '' : 's') + '</small></h2>';
      if (!imp.groups.length) body += '<div class="empty">No jobs found in that file.</div>';
      body += imp.groups.map((g, i) => '<div class="item"><div class="item-h"><label class="inline"><input type="checkbox" data-imp="' + i + '" ' + (g.pick ? 'checked' : '') + '> <b>' + esc(g.title) + '</b></label>' +
        '<span class="chip ' + g.status + '">' + g.status + '</span></div><div class="item-sub">' +
        (g.dup ? '<p class="fpstat prompt">Looks like a job you already have (same title and start date), so it’s unticked.</p>' : '') +
        g.legs.map(l => '<div class="small">' + esc(l.from + ' → ' + l.to) + ' · ' + esc(l.date ? fmtDate(l.date) : 'no date') + (l.time ? ' ' + l.time + 'Z' : '') +
          (g.status === 'confirmed' ? ' · GAR rule: ' + ({ UK: 'UK', FR: 'France', OTHER: 'none' }[icaoCountry(l.to)] || 'UK') : '') + '</div>').join('') +
        (g.status === 'tentative' ? '<div class="small">Tentative: the legs are saved in the notes.</div>' : '') + '</div></div>').join('');
      if (imp.issues.length) body += '<section class="sect"><h3>Check these</h3>' + imp.issues.map(t => '<p class="fpstat prompt">' + esc(t) + '</p>').join('') + '</section>';
      const n = imp.groups.filter(g => g.pick).length;
      if (imp.groups.length) body += '<p class="small" id="impErr"></p><button class="btn primary block" data-act="import-go" ' + (n ? '' : 'disabled') + ' id="impGo">Import ' + n + ' job' + (n === 1 ? '' : 's') + '</button>';
    }
  }
  app.innerHTML = head + '<main>' + body + '</main>';
}
async function importGo() {
  const imp = S.imp, picks = imp.groups.filter(g => g.pick), err = $('#impErr');
  if (picks.length > IMPORT_MAX_JOBS) { err.textContent = 'Please import at most ' + IMPORT_MAX_JOBS + ' jobs at a time.'; return; }
  let done = 0;
  await busy(async () => {
    for (const g of picks) {
      try { const job = await api('createJob', importPayload(g)); S.active.push(job); g.pick = false; g.imported = true; done++; }
      catch (e) { imp.error = 'Imported ' + done + ' of ' + picks.length + '. Stopped at “' + g.title + '”: ' + e.message; break; }
    }
  });
  if (imp.error) { imp.groups = imp.groups.filter(g => !g.imported); render(); return; }
  S.imp = null; S.openId = null; S.tab = 'active'; render();
  toast('Imported ' + done + ' job' + (done === 1 ? '' : 's') + ' – confirmed ones are on your calendar', '');
}
if (window.PILOT_MOCK) window.PILOT_TEST = { parseImport, cellDate, cellTime, importFile };   // lets the automated tests reach the import helpers
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'impFile' && el.files && el.files[0]) importFile(el.files[0]);
  if (el.dataset && el.dataset.imp !== undefined && S.imp) { S.imp.groups[+el.dataset.imp].pick = el.checked; render(); }
});

// ---------- boot ----------
// fromConnect = true when the person has just typed an address/passcode, so any failure goes back to that form
async function load(fromConnect) {
  if (!window.PILOT_MOCK) {
    const c = getCfg();
    if (!c || !c.key) { S.needConnect = true; render(); return; }      // first visit on this device
  }
  try {
    const r = await api('getAll');
    S.active = r.active; S.archive = r.archive; S.appUrl = r.appUrl;
    S.active.concat(S.archive).forEach(j => { (j.legs || []).forEach(splitLeg); (j.flights || []).forEach(fixTravel); });
    S.calendarName = r.calendarName; S.reminders = r.reminderMinutes; S.colours = r.colours;
    S.loaded = true; S.error = ''; S.needConnect = false; S.connectError = '';
    if (OPEN_JOB_ID && !S.opened) { S.opened = true; if (findJob(OPEN_JOB_ID)) S.openId = OPEN_JOB_ID; }
  } catch (e) {
    if (e.code === 'auth' || e.code === 'locked' || e.code === 'not_configured') {
      const c = getCfg();
      if (c && e.code !== 'locked') setCfg({ url: c.url, key: '' });   // forget a rejected passcode (but keep the address)
      S.loaded = false; S.needConnect = true; S.connectError = e.message;
    } else if (fromConnect) {
      S.loaded = false; S.needConnect = true; S.connectError = e.message;
    } else if (S.loaded) {
      toast(e.message, 'err');                                           // a refresh failed: keep showing what we have
    } else {
      S.error = e.message;
    }
  }
  render();
}
render();
load();
})();
</script>
